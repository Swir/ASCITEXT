name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (for example v1.0.0)
        required: true
        default: v1.0.0
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}"
          } else {
            $version = "v1.0.0"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyfiglet pyperclip pyinstaller

      - name: Validate sources
        shell: pwsh
        run: |
          python -m py_compile ASCItext.py
          python -m py_compile ASCItext_EN.py

      - name: Build Polish EXE
        shell: pwsh
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "ASCITEXT-PL" --collect-all pyfiglet ASCItext.py

      - name: Build English EXE
        shell: pwsh
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "ASCITEXT-EN" --collect-all pyfiglet ASCItext_EN.py

      - name: Package release
        shell: pwsh
        run: |
          $package = "ASCITEXT-$env:VERSION-Windows-x64"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "dist/ASCITEXT-PL.exe" "release/ASCITEXT-PL.exe"
          Copy-Item "dist/ASCITEXT-EN.exe" "release/ASCITEXT-EN.exe"
          Copy-Item "README.md" "release/README.md"
          $zip = "$package.zip"
          Compress-Archive -Path "release/*" -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Set-Content "$zip.sha256"
          "ZIP_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @("dist/ASCITEXT-PL.exe", "dist/ASCITEXT-EN.exe", $env:ZIP_NAME, "$env:ZIP_NAME.sha256")
          if (gh release view $env:VERSION --repo "${{ github.repository }}" 2>$null) {
            gh release upload $env:VERSION @assets --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $env:VERSION @assets --target "${{ github.sha }}" --title "ASCITEXT $env:VERSION" --generate-notes --repo "${{ github.repository }}"
          }
